name: Database backup

on:
  schedule:
    # 18:17 UTC = 03:17 KST, outside peak usage.
    - cron: '17 18 * * *'
  workflow_dispatch:

concurrency:
  group: db-backup
  cancel-in-progress: false

permissions:
  contents: read

env:
  PG_CLIENT_VERSION: '18'
  BACKUP_PREFIX: postgres/production
  BACKUP_RETENTION_DAYS: '30'

jobs:
  backup:
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    services:
      restore-target:
        image: postgres:18
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: watchly_restore_drill
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - name: Install PostgreSQL client
        run: |
          sudo install -d /usr/share/postgresql-common/pgdg
          sudo curl -fsSL -o /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc \
            https://www.postgresql.org/media/keys/ACCC4CF8.asc
          echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] https://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" \
            | sudo tee /etc/apt/sources.list.d/pgdg.list > /dev/null
          sudo apt-get update -qq
          sudo apt-get install -y -qq "postgresql-client-${PG_CLIENT_VERSION}"
          echo "/usr/lib/postgresql/${PG_CLIENT_VERSION}/bin" >> "$GITHUB_PATH"

      - name: Dump, verify and encrypt production database
        id: dump
        env:
          DATABASE_URL: ${{ secrets.PROD_DATABASE_URL }}
          BACKUP_ENCRYPTION_PASSPHRASE: ${{ secrets.BACKUP_ENCRYPTION_PASSPHRASE }}
        run: |
          file="$(bash scripts/db-backup.sh "$RUNNER_TEMP/backup")"
          echo "file=$file" >> "$GITHUB_OUTPUT"
          ls -lh "$file"

      - name: Upload backup to R2
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_BACKUP_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_BACKUP_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
          AWS_REQUEST_CHECKSUM_CALCULATION: when_required
          AWS_RESPONSE_CHECKSUM_VALIDATION: when_required
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_BACKUP_BUCKET: ${{ secrets.R2_BACKUP_BUCKET }}
          BACKUP_FILE: ${{ steps.dump.outputs.file }}
        run: |
          endpoint="https://${R2_ACCOUNT_ID}.r2.cloudflarestorage.com"
          name="$(basename "$BACKUP_FILE")"
          aws s3 cp "$BACKUP_FILE" "s3://${R2_BACKUP_BUCKET}/${BACKUP_PREFIX}/${name}" \
            --endpoint-url "$endpoint" --only-show-errors
          aws s3 cp "$BACKUP_FILE.sha256" "s3://${R2_BACKUP_BUCKET}/${BACKUP_PREFIX}/${name}.sha256" \
            --endpoint-url "$endpoint" --only-show-errors

      - name: Restore drill into a throwaway database
        env:
          TARGET_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/watchly_restore_drill
          RESTORE_CONFIRM: watchly_restore_drill
          BACKUP_ENCRYPTION_PASSPHRASE: ${{ secrets.BACKUP_ENCRYPTION_PASSPHRASE }}
        run: bash scripts/db-restore.sh "${{ steps.dump.outputs.file }}"

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Verify restored schema
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/watchly_restore_drill
        run: |
          pnpm install --frozen-lockfile --filter api...
          pnpm --filter api prisma:generate
          pnpm --filter api db:verify
          pnpm --filter api security:backup-readiness

      - name: Delete backups older than retention window
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_BACKUP_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_BACKUP_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
          AWS_REQUEST_CHECKSUM_CALCULATION: when_required
          AWS_RESPONSE_CHECKSUM_VALIDATION: when_required
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_BACKUP_BUCKET: ${{ secrets.R2_BACKUP_BUCKET }}
        run: |
          endpoint="https://${R2_ACCOUNT_ID}.r2.cloudflarestorage.com"
          cutoff="$(date -u -d "-${BACKUP_RETENTION_DAYS} days" +%Y-%m-%dT%H:%M:%SZ)"
          aws s3api list-objects-v2 --bucket "$R2_BACKUP_BUCKET" --prefix "${BACKUP_PREFIX}/" \
            --endpoint-url "$endpoint" \
            --query "Contents[?LastModified<'${cutoff}'].Key" --output text \
            | tr '\t' '\n' | grep -v -e '^None$' -e '^$' \
            | while read -r key; do
                aws s3 rm "s3://${R2_BACKUP_BUCKET}/${key}" --endpoint-url "$endpoint" --only-show-errors
                echo "Deleted ${key}"
              done || true

      - name: Ping backup heartbeat
        if: success()
        env:
          BACKUP_HEARTBEAT_URL: ${{ secrets.BACKUP_HEARTBEAT_URL }}
        run: |
          if [ -n "$BACKUP_HEARTBEAT_URL" ]; then
            curl -fsS --retry 3 "$BACKUP_HEARTBEAT_URL" > /dev/null
          fi
